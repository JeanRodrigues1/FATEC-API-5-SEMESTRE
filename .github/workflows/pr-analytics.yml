name: QA CR PR Metrics

on:
  pull_request:
    branches: [main]  # roda só quando PR é aberto PARA main
    types: [opened, synchronize]

jobs:
  generate-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Executar analise PRs
        uses: AlexSim93/pull-request-analytics-action@v4
        with:
          GITHUB_TOKEN: ${{ s }}
          GITHUB_OWNER_FOR_ISSUE: JeanRodrigues1
          GITHUB_REPO_FOR_ISSUE: FATEC-API-5-SEMESTRE
          GITHUB_OWNERS_REPO: JeanRodrigues1/FATEC-API-5-SEMESTRE
          REPORT_PERIOD: weeks:1
          CORE_HOURS_START: '9:00'
          CORE_HOURS_END: '18:00'
          TIMEZONE: America/Sao_Paulo
          SHOW_STATS_TYPES: timeline,workload,code-review-engagement,response-time
          REQUIRED_APPROVALS: 1
          EXECUTION_OUTCOME: new-issue,markdown,collection


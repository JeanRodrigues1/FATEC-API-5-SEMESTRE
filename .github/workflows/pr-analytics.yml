name: "QA CR Metrics"

on:
  schedule:
    - cron: '0 9 * * 1' # toda segunda-feira às 9hrs
  workflow_dispatch:

jobs:
  generate-metrics:
    name: "Gerar Métricas QA"
    runs-on: ubuntu-latest
    steps:
      - name: "Executar análise PRs"
        uses: AlexSim93/pull-request-analytics-action@v4
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER_FOR_ISSUE: ""   
          GITHUB_REPO_FOR_ISSUE: ""
          GITHUB_OWNERS_REPO: ""
          REPORT_PERIOD: "weeks:1"
          CORE_HOURS_START: "9:00"
          CORE_HOURS_END: "18:00"
          TIMEZONE: "America/Sao_Paulo"
          SHOW_STATS_TYPES: "timeline,workload,code-review-engagement,response-time"
          REQUIRED_APPROVALS: 1
          EXECUTION_OUTCOME: "new-issue,markdown,collection"
